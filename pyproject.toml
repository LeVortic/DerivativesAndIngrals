[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "calculus-tool"
version = "0.1.0"
description = "An educational symbolic and numerical calculus calculator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.gui-scripts]
calculus-tool = "calculus_tool.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
